```yaml
brand:
  name: "Leandro Simões"
  project_name: "BrandOS"
  description: "Agência de marketing pessoal com IA para fortalecer LinkedIn, networking, autoridade, portfólio e oportunidades."
  main_platform: "LinkedIn"
  language: "pt-BR"

positioning:
  main_topics:
    - Python
    - IA aplicada
    - Automação
    - Fullstack
    - Civic Tech
    - Dados públicos
    - Agentes de IA
    - Construção em público
    - Transição de carreira

  avoid:
    - tom de guru
    - exagero de autoridade
    - promessa irreal
    - autopromoção vazia
    - linguagem motivacional genérica
    - parecer vendedor de curso

posting:
  frequency_per_week: 3

  days:
    - segunda
    - quarta
    - sexta

  times:
    segunda: "08:30"
    quarta: "12:15"
    sexta: "08:30"

content_mix:
  monthly_posts: 12

  distribution:
    transicao_de_carreira: 3
    projetos_reais: 3
    ia_aplicada_automacao: 2
    python_fullstack: 2
    civic_tech: 1
    brandos: 1

strategy:
  priorities:
    - networking
    - autoridade
    - portfolio
    - oportunidades

outputs:
  base_folder: "data/generated"
  format: "markdown"

llm:
  default_provider: "gemini"
  default_model: "gemini-1.5-flash"
  temperature: 0.7
  max_output_tokens: 4096

safety:
  publish_automatically: false
  scrape_linkedin: false
  require_human_review: true
```
