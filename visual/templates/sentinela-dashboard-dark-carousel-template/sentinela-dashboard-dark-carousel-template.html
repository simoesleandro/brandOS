<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrossel — Dashboard Dark Template</title>

  <!-- Fonte: Inter (Google Fonts). Se for usar offline, baixe os arquivos
       .woff2 e troque este <link> por um @font-face em template.css. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/template.css" />
</head>
<body>

  <!-- Todo o conteúdo é montado dinamicamente por js/render.js a partir
       de js/config.js. Não edite este HTML para trocar textos ou imagens —
       edite js/config.js. -->
  <div id="carousel-viewport" class="carousel-viewport"></div>

  <script src="js/config.js"></script>
  <script src="js/render.js"></script>

</html>
