{% extends "base.html" %}

{% block content %}
<div class="workbench-hero mb-8">
    <div>
        <a href="/briefings/{{ filename }}" class="text-brandSecondary text-xs hover:text-white mb-4 inline-flex items-center gap-1.5 transition-colors font-mono tracking-widest uppercase">
            <i class="ph ph-arrow-left"></i> Voltar para briefing
        </a>
        <div class="workbench-eyebrow">Etapa 02 · Ajuste humano</div>
        <h1>Editar Briefing</h1>
        <p>Altere o conteúdo do briefing sem remover os metadados do topo.</p>
    </div>
</div>

<div class="operation-card p-6 bg-[#020205]">
    <textarea id="briefingContent" class="w-full bg-[#1a1b23] text-white font-mono text-sm p-4 rounded-lg border border-white/10 h-[600px] mb-4 focus:outline-none focus:border-brandPrimary focus:ring-1 focus:ring-brandPrimary" spellcheck="false">{{ content }}</textarea>
    
    <div class="flex justify-end gap-3 mt-6">
        <button onclick="saveBriefing()" class="btn action-primary flex items-center gap-2">
            <i class="ph ph-floppy-disk"></i> Salvar Alterações
        </button>
    </div>
</div>

<script>
async function saveBriefing() {
    const content = document.getElementById('briefingContent').value;
    
    if (!confirm("Confirmar alterações no briefing?")) return;
    
    const toast = document.createElement('div');
    toast.innerHTML = '<div class="fixed bottom-4 right-4 bg-brandPrimary text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-3"><i class="ph ph-spinner animate-spin"></i> Salvando...</div>';
    document.body.appendChild(toast);
    
    try {
        const response = await fetch(`/briefings/{{ filename }}/edit`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                content: content,
                confirm: true
            })
        });
        
        if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            alert("Erro ao salvar: " + (data.detail || response.statusText));
            toast.remove();
            return;
        }
        
        window.location.href = `/briefings/{{ filename }}`;
    } catch (e) {
        alert("Erro de conexão: " + e.message);
        toast.remove();
    }
}
</script>
{% endblock %}
