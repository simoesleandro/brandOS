<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BrandOS Console{% endblock %}</title>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        vercelDark: '#000000',
                        vercelPanel: '#0a0a0a',
                        vercelBorder: '#27272a',
                        vercelAccent: '#3b82f6',
                        vercelText: '#f4f4f5',
                        vercelMuted: '#a1a1aa'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/brandos.css">
    <script>
        function copyToClipboard(elementId) {
            const el = document.getElementById(elementId);
            if(el) {
                navigator.clipboard.writeText(el.innerText || el.value).then(() => {
                    alert('Copiado para a área de transferência!');
                });
            }
        }
    </script>
</head>
<body class="bg-vercelDark text-vercelText font-sans antialiased h-screen overflow-hidden flex">
    
    <!-- Sidebar -->
    <aside class="w-64 border-r border-vercelBorder bg-vercelPanel flex flex-col h-full flex-shrink-0 z-10 hidden md:flex">
        <div class="p-6">
            <a href="/" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <svg class="w-6 h-6 text-vercelAccent" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                BrandOS
            </a>
        </div>
        
        <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
            <p class="px-2 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 mt-4">Menu</p>
            <a href="/" class="flex items-center gap-3 px-2 py-2 text-sm font-medium rounded-md text-vercelMuted hover:bg-white/5 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Visão Geral
            </a>
            <a href="/generate" class="flex items-center gap-3 px-2 py-2 text-sm font-medium rounded-md text-vercelMuted hover:bg-white/5 hover:text-white transition-colors">
                <svg class="w-5 h-5 text-vercelAccent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span class="text-white">Nova Semana</span>
            </a>
            <a href="/publications" class="flex items-center gap-3 px-2 py-2 text-sm font-medium rounded-md text-vercelMuted hover:bg-white/5 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                Publicações
            </a>
            
            <p class="px-2 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 mt-8">Data</p>
            <a href="/projects" class="flex items-center gap-3 px-2 py-2 text-sm font-medium rounded-md text-vercelMuted hover:bg-white/5 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                Projetos
            </a>
            <a href="/history" class="flex items-center gap-3 px-2 py-2 text-sm font-medium rounded-md text-vercelMuted hover:bg-white/5 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Histórico
            </a>
        </nav>
        
        <div class="p-4 border-t border-vercelBorder">
            <a href="/settings" class="flex items-center gap-3 px-2 py-2 text-sm font-medium rounded-md text-vercelMuted hover:bg-white/5 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Configurações
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-vercelDark relative">
        <div class="max-w-6xl mx-auto px-6 py-10">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
