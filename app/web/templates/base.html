<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BrandOS Authority OS{% endblock %}</title>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- JetBrains Mono for Console / Terminal feeling -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brandBg: '#03030A',
                        brandBgRadial: '#111827',
                        brandSidebar: '#050512',
                        brandBorder: 'rgba(148, 163, 184, 0.12)',
                        brandBorderActive: 'rgba(139, 92, 246, 0.45)',
                        brandAccent: '#3B82F6',
                        brandAccentPurple: '#8B5CF6',
                        brandAccentCyan: '#22D3EE',
                        brandText: '#F8FAFC',
                        brandSecondary: '#A5B4FC',
                        brandMuted: '#64748B'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/brandos.css?v=20260707-authority-os">
    <script>
        function copyToClipboard(elementId) {
            const el = document.getElementById(elementId);
            if(el) {
                navigator.clipboard.writeText(el.innerText || el.value).then(() => {
                    alert('Copiado para a área de transferência!');
                });
            }
        }
    </script>
</head>

    <script>
        // JS para definir Sidebar Ativa
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.sidebar-link');
            navLinks.forEach(link => {
                const linkPath = link.getAttribute('href');
                if (linkPath === currentPath || (linkPath !== '/' && currentPath.startsWith(linkPath))) {
                    link.classList.add('active');
                }
            });
        });
    </script>

<script>
async function generateLearning(itemId) {
  if (!confirm("Gerar aprendizado editorial para esta publicação?")) return;

  // Mostra um alert de carregamento simples ou desabilita tela
  const toast = document.createElement('div');
  toast.innerHTML = '<div class="fixed bottom-4 right-4 bg-brandPrimary text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-3"><i class="ph ph-spinner animate-spin"></i> Gerando aprendizado...</div>';
  document.body.appendChild(toast);

  try {
      const response = await fetch(`/publications/posts/${itemId}/generate-learning`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({confirm: true})
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        alert("Erro ao gerar aprendizado: " + (data.detail || response.statusText));
        toast.remove();
        return;
      }

      window.location.href = `/publications/posts/${itemId}/learning`;
  } catch (error) {
      alert("Erro de conexão: " + error.message);
      toast.remove();
  }
}

async function generateStrategicMemory() {
    if (!confirm("Deseja gerar uma nova memória estratégica baseada nos posts dos últimos 30 dias?")) return;
    
    const toast = document.createElement('div');
    toast.innerHTML = '<div class="fixed bottom-4 right-4 bg-brandPrimary text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-3"><i class="ph ph-spinner animate-spin"></i> Gerando memória estratégica... (isso pode demorar um pouco)</div>';
    document.body.appendChild(toast);
    
    try {
        const response = await fetch(`/strategic-memory/generate`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                confirm: true,
                window_days: 30
            })
        });
        
        if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            alert("Erro: " + (data.detail || response.statusText));
            toast.remove();
            return;
        }
        
        const result = await response.json();
        window.location.href = `/strategic-memory/${result.memory_id}`;
    } catch (e) {
        alert("Erro de conexão: " + e.message);
        toast.remove();
        window.__generatingCmoRecommendation = false;
        if (btnElem) {
            btnElem.disabled = false;
            btnElem.innerHTML = originalText;
            btnElem.classList.remove("opacity-50", "cursor-not-allowed");
        }
    }
}

window.__generatingCmoRecommendation = false;

async function generateCmoRecommendation(btnElem) {
    if (window.__generatingCmoRecommendation) return;
    if (!confirm("Deseja gerar uma nova recomendação estratégica com base nos dados mais recentes?")) return;
    
    window.__generatingCmoRecommendation = true;
    let originalText = "";
    if (btnElem) {
        btnElem.disabled = true;
        originalText = btnElem.innerHTML;
        btnElem.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Gerando...';
        btnElem.classList.add("opacity-50", "cursor-not-allowed");
    }
    
    const toast = document.createElement('div');
    toast.innerHTML = '<div class="fixed bottom-4 right-4 bg-brandAccentPurple text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-3"><i class="ph ph-spinner animate-spin"></i> O CMO Agent está pensando... (isso pode demorar)</div>';
    document.body.appendChild(toast);
    
    try {
        const response = await fetch(`/cmo/recommendation/generate`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                confirm: true,
                window_days: 30
            })
        });
        
        if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            alert("Erro: " + (data.detail || response.statusText));
            toast.remove();
            return;
        }
        
        const result = await response.json();
        window.location.href = `/cmo/recommendations/${result.recommendation_id}`;
    } catch (e) {
        alert("Erro de conexão: " + e.message);
        toast.remove();
        window.__generatingCmoRecommendation = false;
        if (btnElem) {
            btnElem.disabled = false;
            btnElem.innerHTML = originalText;
            btnElem.classList.remove("opacity-50", "cursor-not-allowed");
        }
    }
}

window.__creatingBriefingFromCmo = false;

async function createBriefingFromCmo(recommendationId, btnElem) {
    if (window.__creatingBriefingFromCmo) return;
    if (!confirm("Isso criará um briefing em rascunho para revisão humana. Nenhuma semana será gerada automaticamente. Continuar?")) return;
    
    window.__creatingBriefingFromCmo = true;
    let originalText = "";
    if (btnElem) {
        btnElem.disabled = true;
        originalText = btnElem.innerHTML;
        btnElem.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Criando briefing...';
        btnElem.classList.add("opacity-50", "cursor-not-allowed");
    }
    
    const toast = document.createElement('div');
    toast.innerHTML = '<div class="fixed bottom-4 right-4 bg-brandAccentPurple text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-3"><i class="ph ph-spinner animate-spin"></i> Convertendo recomendação em briefing...</div>';
    document.body.appendChild(toast);
    
    try {
        const response = await fetch(`/cmo/recommendations/${recommendationId}/create-briefing`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                confirm: true
            })
        });
        
        if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            alert("Erro: " + (data.detail || response.statusText));
            toast.remove();
            return;
        }
        
        const result = await response.json();
        if (result.briefing_filename) {
            window.location.href = `/briefings/${result.briefing_filename}`;
        } else {
            window.location.href = `/briefings`;
        }
    } catch (e) {
        alert("Erro de conexão: " + e.message);
        toast.remove();
        window.__generatingCmoRecommendation = false;
        if (btnElem) {
            btnElem.disabled = false;
            btnElem.innerHTML = originalText;
            btnElem.classList.remove("opacity-50", "cursor-not-allowed");
        }
    }
}

async function archiveStaleCmoRecommendations(btnElem) {
    if (!confirm("Arquivar recomendações antigas e duplicadas, mantendo só a recomendação ativa mais recente?")) return;

    let originalText = "";
    if (btnElem) {
        btnElem.disabled = true;
        originalText = btnElem.innerHTML;
        btnElem.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Arquivando...';
        btnElem.classList.add("opacity-50", "cursor-not-allowed");
    }

    try {
        const response = await fetch(`/cmo/recommendations/archive-stale`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ confirm: true })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            alert("Erro: " + (data.detail || response.statusText));
            return;
        }

        alert(data.message || "Recomendações antigas arquivadas.");
        window.location.reload();
    } catch (e) {
        alert("Erro de conexão: " + e.message);
        if (btnElem) {
            btnElem.disabled = false;
            btnElem.innerHTML = originalText;
            btnElem.classList.remove("opacity-50", "cursor-not-allowed");
        }
    }
}
</script>
