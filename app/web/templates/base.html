<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BrandOS Command Center{% endblock %}</title>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- JetBrains Mono for Console / Terminal feeling -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brandBg: '#03030A',
                        brandBgRadial: '#111827',
                        brandSidebar: '#050512',
                        brandBorder: 'rgba(148, 163, 184, 0.12)',
                        brandBorderActive: 'rgba(139, 92, 246, 0.45)',
                        brandAccent: '#3B82F6',
                        brandAccentPurple: '#8B5CF6',
                        brandAccentCyan: '#22D3EE',
                        brandText: '#F8FAFC',
                        brandSecondary: '#A5B4FC',
                        brandMuted: '#64748B'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/brandos.css">
    <script>
        function copyToClipboard(elementId) {
            const el = document.getElementById(elementId);
            if(el) {
                navigator.clipboard.writeText(el.innerText || el.value).then(() => {
                    alert('Copiado para a área de transferência!');
                });
            }
        }
    </script>
</head>
<body class="bg-brandBg text-brandText font-sans antialiased h-screen overflow-hidden flex relative bg-ai-grid">
    <!-- Glow radial de fundo -->
    <div class="absolute inset-0 glow-radial-bg pointer-events-none -z-10"></div>
    
    <!-- Sidebar -->
    <aside class="w-64 border-r border-brandBorder bg-brandSidebar/90 backdrop-blur-xl flex flex-col h-full flex-shrink-0 z-20 hidden md:flex shadow-2xl relative">
        <div class="p-6 border-b border-brandBorder/50">
            <a href="/" class="flex flex-col gap-1.5 relative group">
                <div class="absolute -left-2 top-1 bottom-1 w-1 bg-brandAccentPurple rounded-r opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="flex items-center gap-3 text-2xl font-bold tracking-tight text-white">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brandAccentPurple to-brandAccent flex items-center justify-center shadow-[0_0_15px_rgba(139,92,246,0.4)]">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    BrandOS
                </div>
                <span class="text-[9px] uppercase tracking-widest text-brandSecondary font-bold ml-11">AI Command Center</span>
            </a>
        </div>
        
        <nav class="flex-1 px-4 space-y-1.5 overflow-y-auto mt-6">
            <p class="px-3 text-[10px] font-bold text-brandMuted uppercase tracking-widest mb-3">Operação</p>
            <a href="/" class="sidebar-link flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-brandMuted hover:text-white transition-colors">
                <svg class="w-5 h-5 text-brandMuted transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Visão Geral
            </a>
            <a href="/generate" class="sidebar-link flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-brandMuted hover:text-white transition-colors">
                <svg class="w-5 h-5 text-brandAccentPurple transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span class="text-white">Nova Semana</span>
            </a>
            <a href="/publications" class="sidebar-link flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-brandMuted hover:text-white transition-colors">
                <svg class="w-5 h-5 text-brandMuted transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                Publicações
            </a>
            <a href="/calendar" class="sidebar-link flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-brandMuted hover:text-white transition-colors">
                <svg class="w-5 h-5 text-brandMuted transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Agenda Editorial
            </a>
            <a href="/briefings" class="sidebar-link flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-brandMuted hover:text-white transition-colors">
                <svg class="w-5 h-5 text-brandMuted transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Briefings
            </a>
            
            <p class="px-3 text-[10px] font-bold text-brandMuted uppercase tracking-widest mb-3 mt-8">Inteligência & Dados</p>
            <a href="/projects" class="sidebar-link flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-brandMuted hover:text-white transition-colors">
                <svg class="w-5 h-5 text-brandMuted transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                Projetos
            </a>
            <a href="/history" class="sidebar-link flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-brandMuted hover:text-white transition-colors">
                <svg class="w-5 h-5 text-brandMuted transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Histórico
            </a>
            <a href="#" class="sidebar-link flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-brandMuted opacity-50 cursor-not-allowed">
                <svg class="w-5 h-5 text-brandMuted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Assets Visuals
            </a>
        </nav>
        
        <div class="p-4 mt-auto border-t border-brandBorder/50">
            <a href="/settings" class="sidebar-link flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-brandMuted hover:text-white transition-colors mb-4">
                <svg class="w-5 h-5 text-brandMuted transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Configurações
            </a>
            
            <div class="px-3 py-2 bg-brandBg/50 rounded-lg border border-brandBorder/30 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="ai-pulse-dot"></div>
                    <div>
                        <p class="text-[9px] text-brandMuted uppercase tracking-widest font-bold font-mono">Status do Sistema</p>
                        <p class="text-xs text-white font-medium">Local &middot; Online</p>
                    </div>
                </div>
                <div class="text-right">
                    <span class="badge bg-brandAccentPurple/20 text-brandAccentPurple border border-brandAccentPurple/30 text-[9px] px-1.5">ALPHA</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 md:p-8 custom-scrollbar relative z-10">
        <div class="mx-auto max-w-[1536px]">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
        // JS para definir Sidebar Ativa
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.sidebar-link');
            navLinks.forEach(link => {
                const linkPath = link.getAttribute('href');
                if (linkPath === currentPath || (linkPath !== '/' && currentPath.startsWith(linkPath))) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
